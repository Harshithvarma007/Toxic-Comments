# Local production-like stack: the API container + the website, wired together.
services:
  api:
    build: ./api
    ports: ["8000:8000"]
    environment:
      TOXIC_CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      start_period: 20s
  web:
    build: ./web
    ports: ["3000:3000"]
    environment:
      TOXIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
