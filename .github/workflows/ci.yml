name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Fetch released model
        id: model
        working-directory: .
        run: scripts/fetch_model.sh && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "::warning::model release not found; skipping model tests"
      - if: steps.model.outputs.ok == 'true'
        run: pytest -q
      - if: steps.model.outputs.ok == 'true'
        name: Docker build + smoke test
        run: |
          docker build -t toxic-api .
          docker run -d -p 8000:8000 --name api toxic-api
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs -X POST localhost:8000/v1/classify -H 'Content-Type: application/json' -d '{"texts":["you are an idiot"]}'

  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scikit-learn pandas pytest ruff
      - run: ruff check toxicity tests --select E,F,I,B --ignore E501
      - run: pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: extension/pnpm-lock.yaml }
      - run: pnpm --dir extension install --frozen-lockfile
      - name: Fetch released model
        id: model
        run: scripts/fetch_model.sh && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "::warning::model release not found; skipping extension build"
      - if: steps.model.outputs.ok == 'true'
        run: pnpm --dir extension build && node extension/test/parity.mjs

  video:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: video } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: video/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
